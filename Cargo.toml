[package]
name = "reqwest-embedded-roots"
version = "0.1.0"
description = "reqwest client factory with Mozilla's CA roots compiled in and the OS trust store layered on top — no ca-certificates package needed in container images"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/legra-ai/reqwest-embedded-roots"
documentation = "https://docs.rs/reqwest-embedded-roots"
readme = "README.md"
build = "build.rs"
keywords = ["reqwest", "tls", "webpki", "certificates", "containers"]
categories = ["web-programming::http-client", "cryptography"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "build.rs",
    "src/**/*.rs",
]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
tracing = "0.1"
webpki-roots = "1"

[build-dependencies]
rhusky = "0.0.6"

[lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"

[lints.rustdoc]
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
